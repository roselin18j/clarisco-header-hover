<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f6f6f6;
      margin: 0;
      padding: 0;
    }
    .email-container {
      max-width: 600px;
      margin: 20px auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: #333333;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #dddddd;
    }
    th {
      background-color: #f2f2f2;
      width: 30%;
    }
    td {
      width: 70%;
    }
    .footer {
      margin-top: 30px;
      text-align: center;
      color: #888888;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="email-container">
    <h2>New Customer Details</h2>
    <table>
      <tr>
        <th>Customer Name</th>
        <td>##CUSTOMERNAME##</td>
      </tr>
      <tr>
        <th>Email</th>
        <td>##CUSTOMEREMAIL##</td>
      </tr>
      <tr>
        <th>Requirement</th>
        <td>##CUSTOMERREQUIREMENT##</td>
      </tr>
      <tr>
        <th>Mobile</th>
        <td>##CUSTOMERMOBILE##</td>
      </tr>
      <tr>
        <th>Country</th>
        <td>##CUSTOMERCOUNTRY##</td>
      </tr>
      <tr>
        <th>Message</th>
        <td>##CUSTOMERMESSAGE##</td>
      </tr>
    </table>
    <div class="footer">
      &copy; 202 Clarisco Solutions. All rights reserved.
    </div>
  </div>
</body>
</html>
